<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gracias</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
tailwind.config = {
    darkMode: "class",
    theme: {
        extend: {
            colors: {
                "background-dark": "#0f172a",
                "card-dark": "rgba(30, 41, 59, 0.7)",
                "glass-border": "rgba(255, 255, 255, 0.1)",
            },
            fontFamily: { display: ["Inter", "sans-serif"] },
            borderRadius: { DEFAULT: "1.5rem" },
            animation: {
                'float': 'float 6s ease-in-out infinite',
                'pulse-glow': 'pulse-glow 3s infinite',
            },
            keyframes: {
                float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-15px)' } },
                'pulse-glow': {
                    '0%, 100%': { filter: 'drop-shadow(0 0 15px rgba(236, 72, 153, 0.4))' },
                    '50%': { filter: 'drop-shadow(0 0 30px rgba(236, 72, 153, 0.7))' },
                }
            }
        },
    },
};
</script>
<style>
body { font-family: 'Inter', sans-serif; min-height: 100vh; }
.glass-panel { backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); background: rgba(30, 41, 59, 0.45); border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4); }
.heart-icon { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48; background: linear-gradient(135deg, #ec4899 0%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
</style>
</head>
<body class="bg-background-dark min-h-screen flex flex-col p-6 lg:p-8 relative overflow-hidden transition-colors duration-300">
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900"></div>
<div class="absolute inset-0 bg-slate-900/60 mix-blend-multiply"></div>
<div class="absolute inset-0 bg-gradient-to-tr from-indigo-900/80 via-slate-900/60 to-purple-900/50"></div>
</div>
<header class="relative z-10 w-full mx-auto mb-6 flex items-center justify-between opacity-0 pointer-events-none">
<span></span>
</header>
<main class="relative z-10 w-full h-full flex flex-col flex-grow items-center justify-center p-4">
<div class="glass-panel w-full max-w-3xl rounded-[3rem] p-12 md:p-20 flex flex-col items-center justify-center text-center relative overflow-hidden animate-float">
<div class="absolute top-1/4 right-1/4 p-32 bg-pink-500/20 blur-[90px] rounded-full pointer-events-none"></div>
<div class="absolute bottom-1/4 left-1/4 p-32 bg-purple-500/20 blur-[90px] rounded-full pointer-events-none"></div>
<div class="relative z-10 mb-8 animate-pulse-glow">
<span class="material-symbols-outlined heart-icon" style="font-size: 8rem;">favorite</span>
</div>
<div class="relative z-10 mb-6 space-y-4 max-w-xl">
<h1 class="text-5xl md:text-6xl font-bold text-white tracking-tight drop-shadow-lg">
    ¡Muchas gracias!
</h1>
<p class="text-indigo-100 text-xl md:text-2xl font-light leading-relaxed">
    Tu opinión nos ayuda a brindarte un mejor servicio.
</p>
</div>
<div class="relative z-10 mt-8 w-full max-w-sm">
<button onclick="Android.goHome()" class="w-full py-5 rounded-2xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold text-lg shadow-lg shadow-purple-500/30 hover:shadow-purple-500/50 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-3 border border-white/20 group">
<span class="material-icons-round text-2xl group-hover:-translate-x-1 transition-transform">home</span>
<span>Volver al Inicio</span>
</button>
</div>
</div>
</main>
<script>
document.documentElement.classList.add('dark');
setTimeout(function() { try { Android.goHome(); } catch(e) {} }, 8000);
</script>
</body></html>
