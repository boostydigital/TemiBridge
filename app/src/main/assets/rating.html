<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Valoracion</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
tailwind.config = {
    darkMode: "class",
    theme: {
        extend: {
            colors: {
                primary: "#3b82f6",
                "background-dark": "#0f172a",
                "card-dark": "rgba(30, 41, 59, 0.7)",
                "glass-border": "rgba(255, 255, 255, 0.1)",
            },
            fontFamily: { display: ["Inter", "sans-serif"] },
            borderRadius: { DEFAULT: "1.5rem" },
            animation: {
                'float': 'float 6s ease-in-out infinite',
                'pop': 'pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                'glow': 'glow 2s ease-in-out infinite alternate',
            },
            keyframes: {
                float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
                pop: { '0%': { transform: 'scale(0.8)', opacity: 0.5 }, '100%': { transform: 'scale(1.2)', opacity: 1 } },
                glow: { 'from': { filter: 'drop-shadow(0 0 5px rgba(234, 179, 8, 0.4))' }, 'to': { filter: 'drop-shadow(0 0 20px rgba(234, 179, 8, 0.8))' } }
            }
        },
    },
};
</script>
<style>
body { font-family: 'Inter', sans-serif; min-height: 100vh; }
.glass-panel { backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); }
.glass-button { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); }
.rating-group { display: flex; flex-direction: row-reverse; justify-content: center; }
.rating-group > input { display: none; }
.rating-group > label { cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); color: rgba(255, 255, 255, 0.2); }
.rating-group > input:checked ~ label, .rating-group > input:checked ~ label ~ label { color: #fbbf24; filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.5)); transform: scale(1.1); }
.rating-group > label:hover, .rating-group > label:hover ~ label { color: #fcd34d !important; }
@keyframes pulse-subtle {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.05); opacity: 1; }
}
.animate-pulse-subtle { animation: pulse-subtle 3s ease-in-out infinite; }
</style>
</head>
<body class="bg-background-dark min-h-screen flex flex-col p-6 lg:p-8 relative overflow-hidden transition-colors duration-300">
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900"></div>
<div class="absolute inset-0 bg-slate-900/70 mix-blend-multiply"></div>
<div class="absolute inset-0 bg-gradient-to-t from-slate-900/90 via-slate-900/60 to-slate-900/40"></div>
</div>
<header class="relative z-10 w-full mx-auto mb-6 flex items-center justify-between">
<button onclick="Android.goBack()" class="flex items-center space-x-2 text-white/80 hover:text-white transition-colors glass-button px-5 py-3 rounded-full group">
<span class="material-icons-round text-2xl group-hover:-translate-x-1 transition-transform">arrow_back</span>
<span class="text-base font-medium">Volver</span>
</button>
<button onclick="Android.skip()" class="text-white/70 hover:text-white font-medium tracking-wide text-lg px-6 py-2 rounded-full hover:bg-white/10 transition-all flex items-center gap-2 group">
<span>Saltar</span>
<span class="material-icons-round text-xl group-hover:translate-x-1 transition-transform">skip_next</span>
</button>
</header>
<main class="relative z-10 w-full h-full flex flex-col flex-grow items-center justify-center p-8 lg:p-12">
<div class="glass-panel w-full max-w-5xl rounded-[2.5rem] p-10 md:p-16 flex flex-col items-center justify-center text-center relative overflow-hidden shadow-2xl">
<div class="absolute top-0 right-0 p-40 bg-purple-500/10 blur-[100px] rounded-full pointer-events-none"></div>
<div class="absolute bottom-0 left-0 p-40 bg-teal-500/10 blur-[100px] rounded-full pointer-events-none"></div>
<div class="relative z-10 mb-12 space-y-3">
<p class="text-teal-400 font-semibold tracking-widest uppercase text-sm md:text-base mb-2">Evento: <span class="text-2xl md:text-3xl block mt-2 text-teal-300 font-extrabold tracking-normal">{{EVENT_NAME}}</span></p>
<h1 class="text-4xl md:text-6xl font-extrabold text-white tracking-tight leading-tight">
    ¡Valoramos tu opinión!
</h1>
<p class="text-gray-300 text-lg md:text-xl font-light">
    ¿Cómo calificarías tu experiencia reciente?
</p>
</div>
<div class="relative z-10 mb-12">
<div class="rating-group gap-4 md:gap-6">
<input class="star-input" id="star5" name="rating" type="radio" value="5"/>
<label class="star-label animate-pulse-subtle" for="star5"><span class="material-icons-round" style="font-size: 4.5rem;">star</span></label>
<input class="star-input" id="star4" name="rating" type="radio" value="4"/>
<label class="star-label animate-pulse-subtle" for="star4"><span class="material-icons-round" style="font-size: 4.5rem;">star</span></label>
<input class="star-input" id="star3" name="rating" type="radio" value="3"/>
<label class="star-label animate-pulse-subtle" for="star3"><span class="material-icons-round" style="font-size: 4.5rem;">star</span></label>
<input class="star-input" id="star2" name="rating" type="radio" value="2"/>
<label class="star-label animate-pulse-subtle" for="star2"><span class="material-icons-round" style="font-size: 4.5rem;">star</span></label>
<input class="star-input" id="star1" name="rating" type="radio" value="1"/>
<label class="star-label animate-pulse-subtle" for="star1"><span class="material-icons-round" style="font-size: 4.5rem;">star</span></label>
</div>
</div>
<div class="relative z-10 mb-10">
<p class="text-white/60 text-xs md:text-sm font-medium tracking-widest uppercase bg-white/5 py-2.5 px-8 rounded-full inline-block border border-white/10 backdrop-blur-md">
    Gracias por ayudarnos a mejorar
</p>
</div>
<div class="relative z-10 w-full max-w-sm">
<button onclick="submitRating()" class="w-full py-5 rounded-2xl bg-gradient-to-r from-teal-500 to-emerald-600 text-white font-bold text-xl shadow-lg shadow-teal-500/30 hover:shadow-teal-500/50 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-3 border border-white/20 group">
<span>Enviar Valoración</span>
<span class="material-icons-round text-2xl group-hover:translate-x-1 transition-transform">send</span>
</button>
</div>
</div>
</main>
<script>
document.documentElement.classList.add('dark');
function submitRating() {
    var checked = document.querySelector('input[name="rating"]:checked');
    if (checked) {
        Android.submitRating(parseInt(checked.value));
    }
}
</script>
</body></html>
